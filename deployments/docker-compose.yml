version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: password
      POSTGRES_DB: accounting_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  accounting-service:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - HTTP_PORT=8080
      - GRPC_PORT=50051
      - DATABASE_DSN=postgres://accounting:password@postgres:5432/accounting_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
