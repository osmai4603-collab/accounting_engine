services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: accounting_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  accounting-service:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - HTTP_PORT=8080
      - GRPC_PORT=50051
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_READ_REQUESTS=${RATE_LIMIT_READ_REQUESTS:-60}
      - RATE_LIMIT_WRITE_REQUESTS=${RATE_LIMIT_WRITE_REQUESTS:-20}
      - RATE_LIMIT_CLIENT_READ_REQUESTS=${RATE_LIMIT_CLIENT_READ_REQUESTS:-600}
      - RATE_LIMIT_CLIENT_WRITE_REQUESTS=${RATE_LIMIT_CLIENT_WRITE_REQUESTS:-200}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-1m}
      - RATE_LIMIT_MAX_KEYS=${RATE_LIMIT_MAX_KEYS:-10000}
      - DATABASE_DSN=${DATABASE_DSN:?Set DATABASE_DSN in the environment}
    depends_on:
      postgres:
        condition: service_healthy
